<!DOCTYPE html>
<html>

<head>
    <title>Publish Job Ad</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="left-side">
            <div class="logo">
                <img src="talendo.png" class="im">
                <span>talendo</span>
            </div>
            <nav class="menu">
                <a href="#">Dashboard</a>
                <a href="#" class="menulink active">Job Ads</a>
                <a href="#">Company</a>
                <a href="#">Settings</a>
            </nav>
        </div>
        <div class="right-side">
            <div class="profile">
                <p>Employer</p>
                <select class="employer">
                    <option></option>
                </select>
            </div>
            <div class="avatar">JH</div>
            <span>J.Hoffman</span>
        </div>
    </header>

    <main>
        <div class="pricing">
            <h1 id="heading">Publish Job Ad</h1>
            <h2 id="subtitle">Choose an option</h2>
        </div>

        <div class="pricingcontainer">
            <div class="index">
                <div id="space"></div>
                <table>
                    <tr>
                        <td>Desktop version</td>
                    </tr>
                    <tr>
                        <td>30 Days online</td>
                    </tr>
                    <tr>
                        <td>Mobile optimized</td>
                    </tr>
                    <tr>
                        <td>Top placement</td>
                    </tr>
                    <tr>
                        <td>Talendo app</td>
                    </tr>
                    <tr>
                        <td>Social media ads</td>
                    </tr>
                    <tr>
                        <td>Mailing ads</td>
                    </tr>
                </table>
            </div>

            <div class="basicplan">
                <h4 id="basic">Basic</h4>
                <h2>CHF 250.00</h2>
                <table class="feature-table">
                    <tr>
                        <td><i class="fa-solid fa-check icon tick"></i></td>
                    </tr>
                    <tr>
                        <td><i class="fa-solid fa-check icon tick"></i></td>
                    </tr>
                    <tr>
                        <td><i class="fa-solid fa-check icon tick"></i></td>
                    </tr>
                    <tr>
                        <td><i class="fa-solid fa-check icon tick"></i></td>
                    </tr>
                    <tr>
                        <td><i class="fa-solid fa-check icon tick"></i></td>
                    </tr>
                    <tr>
                        <td><i class="fa-solid fa-xmark icon cross"></i></td>
                    </tr>
                    <tr>
                        <td><i class="fa-solid fa-xmark icon cross"></i></td>
                    </tr>
                </table>
            </div>

            <div class="packageopti">

                <!-- Package 1 -->
                <label class="packagecard">
                    <div class="package-savings">
                        <input type="radio" name="package" class="radio" value="3" checked />
                        <span class="custom-radio"></span>
                        <div class="package-left">
                            <h4>3x Package<br><span>7% Savings</span></h4>
                        </div>
                        <div class="package-center">
                            <p class="total">Total<br><strong style="font-size: 20px;">CHF 650.00</strong></p>
                        </div>
                        <div class="vertical-line"></div>
                        <div class="package-right">
                            <p><span class="sub-total">Sub-Total</span><br><strong style="font-size: 20px;">CHF 216.00</strong></p>
                        </div>
                    </div>
                </label>

                <!-- Package 2 -->
                <label class="packagecard">
                    <div class="package-savings">
                        <input type="radio" name="package" class="radio" value="5" />
                        <span class="custom-radio"></span>
                        <div class="package-left">
                            <h4>5x Package<br><span>20% Savings</span></h4>
                        </div>
                        <div class="package-center">
                            <p class="total">Total<br><strong style="font-size: 20px;">CHF 980.00</strong></p>
                        </div>
                        <div class="vertical-line"></div>
                        <div class="package-right">
                            <p><span class="sub-total">Sub-Total</span><br><strong style="font-size: 20px;">CHF 196.00</strong></p>
                        </div>
                    </div>
                </label>

                <!-- Package 3 -->
                <label class="packagecard">
                    <div class="package-savings">
                        <input type="radio" name="package" class="radio" value="10" />
                        <span class="custom-radio"></span>
                        <div class="package-left">
                            <h4>10x Package<br><span>30% Savings</span></h4>
                        </div>
                        <div class="package-center">
                            <p class="total">Total<br><strong style="font-size: 20px;">CHF 1700.00</strong></p>
                        </div>
                        <div class="vertical-line"></div>
                        <div class="package-right">
                            <p><span class="sub-total">Sub-Total</span><br><strong style="font-size: 20px;">CHF 170.00</strong></p>
                        </div>
                    </div>
                </label>

                <!-- Package 4 -->
                <label class="packagecard">
                    <div class="package-savings">
                        <input type="radio" name="package" class="radio" value="20" />
                        <span class="custom-radio"></span>
                        <div class="package-left">
                            <h4>20x Package<br><span>Best Price</span></h4>
                        </div>
                        <div class="package-center">
                            <p class="total">Total<br><strong style="font-size: 20px;">CHF 2800.00</strong></p>
                        </div>
                        <div class="vertical-line"></div>
                        <div class="package-right">
                            <p><span class="sub-total">Sub-Total</span><br><strong style="font-size: 20px;">CHF 140.00</strong></p>
                        </div>
                    </div>
                </label>
            </div>
        </div>
    </main>

    <div class="footer-section">
        <div class="toggle-section">
            <label>
                <input type="checkbox" id="pricingToggle"/>
            </label>
            <div class="final">Package Pricing<br>
                <span>Save up to 40%</span>
            </div>
        </div>
        <footer>
            <button class="first" onclick="showAlert()">Continue to Extensions</button>
            <button class="second"><i class="fas fa-arrow-circle-left"></i> Back</button>
        </footer>
    </div>


<script>
function showAlert() {
    alert("The package has been selected.");
}

const packageRadios = document.querySelectorAll('input[name="package"]');
const featureIcons = document.querySelectorAll('.feature-table i');
const pricingToggle = document.getElementById('pricingToggle');
packageRadios.forEach(radio => {
    radio.addEventListener('change', () => {
        if (pricingToggle.checked) return;
        const selectedValue = parseInt(radio.value);
        featureIcons.forEach((icon, index) => {
            if (index < selectedValue) {
                icon.classList.remove('fa-xmark', 'cross');
                icon.classList.add('fa-check', 'tick');
            } else {
                icon.classList.remove('fa-check', 'tick');
                icon.classList.add('fa-xmark', 'cross');
            }
        });
    });
});

pricingToggle.addEventListener('change', function () {
    if (this.checked) {
        featureIcons.forEach(icon => {
            icon.classList.remove('fa-xmark', 'cross');
            icon.classList.add('fa-check', 'tick');
        });
    } else {
        const selectedPackage = document.querySelector('input[name="package"]:checked');
        const selectedValue = parseInt(selectedPackage.value);

        featureIcons.forEach((icon, index) => {
            if (index < selectedValue) {
                icon.classList.remove('fa-xmark', 'cross');
                icon.classList.add('fa-check', 'tick');
            } else {
                icon.classList.remove('fa-check', 'tick');
                icon.classList.add('fa-xmark', 'cross');
            }
        });
    }
});
</script>

</body>

</html>
